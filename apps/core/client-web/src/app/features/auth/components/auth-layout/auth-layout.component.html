<div class="auth-layout">
  <!-- Background Elements -->
  <div class="auth-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Main Content Area -->
  <main class="auth-content animate-fade-in-up">
    <!-- Logo -->
    <div class="auth-logo">
      <img src="assets/images/logo-full.svg" alt="FacturaPRO" />
    </div>

    <!-- Card Content -->
    <div class="auth-card">
      <ng-content></ng-content>
    </div>

    <!-- Alternate Actions -->
    <div class="auth-footer-actions">
      <ng-content select="[footer-actions]"></ng-content>
    </div>
  </main>

  <!-- Footer -->
  <app-auth-footer class="auth-footer-component"></app-auth-footer>
</div>
