<div class="auth-layout login-wrapper">
  <!-- Language Selector -->
  <div class="top-language-selector">
    <div class="language-selector">
      <div class="selector-trigger" (click)="toggleLangDropdown($event)" [class.active]="isLangDropdownOpen">
        <span class="selector-icon">🌐</span>
        <span>{{ currentLangLabel }}</span>
        <span class="dropdown-icon">▼</span>
      </div>

      <div class="dropdown-menu" [class.show]="isLangDropdownOpen">
        <div class="dropdown-item"
             *ngFor="let lang of availableLanguages"
             [class.active]="currentLang === lang.code"
             (click)="changeLang(lang.code)">
          <span class="flag-icon">{{ lang.flag }}</span>
          <span>{{ lang.label }}</span>
          <span *ngIf="currentLang === lang.code" class="check-icon">✓</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="auth-container">
    <div class="auth-card">
      <ng-content></ng-content>
      <div class="auth-footer-actions">
          <ng-content select="[footer-actions]"></ng-content>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <app-auth-footer></app-auth-footer>
</div>
