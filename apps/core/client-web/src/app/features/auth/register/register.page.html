
<app-auth-layout>
  <div class="auth-view fade-in">

    <div class="header">
      <h2>{{ 'REGISTER.TITLE' | translate }}</h2>
      <p>{{ 'REGISTER.SUBTITLE' | translate }}</p>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage()" class="alert-error">
      <span>{{ errorMessage() | translate }}</span>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">

      <!-- Personal Info Grid -->
      <div class="grid-2">
        <app-auth-input
          [label]="'REGISTER.FIRST_NAME_LABEL'"
          [placeholder]="'REGISTER.FIRST_NAME_PLACEHOLDER'"
          [icon]="UserIcon"
          [control]="$any(f['firstName'])"
          errorKey="REGISTER.ERRORS"
        ></app-auth-input>

        <app-auth-input
          [label]="'REGISTER.LAST_NAME_LABEL'"
          [placeholder]="'REGISTER.LAST_NAME_PLACEHOLDER'"
          [icon]="UserIcon"
          [control]="$any(f['lastName'])"
          errorKey="REGISTER.ERRORS"
        ></app-auth-input>
      </div>

      <app-auth-input
        [label]="'REGISTER.EMAIL_LABEL'"
        [placeholder]="'REGISTER.EMAIL_PLACEHOLDER'"
        type="email"
        [icon]="MailIcon"
        [control]="$any(f['email'])"
        errorKey="REGISTER.ERRORS"
      ></app-auth-input>

      <app-auth-input
        [label]="'REGISTER.PASSWORD_LABEL'"
        [placeholder]="'REGISTER.PASSWORD_PLACEHOLDER'"
        type="password"
        [icon]="LockIcon"
        [control]="$any(f['password'])"
        errorKey="REGISTER.ERRORS"
      ></app-auth-input>

      <div class="section-divider">
          <p class="section-title">{{ 'REGISTER.COMPANY_INFO' | translate }}</p>

          <div class="grid-2">
            <app-auth-input
                [label]="'REGISTER.ORG_NAME_LABEL'"
                [placeholder]="'REGISTER.ORG_NAME_PLACEHOLDER'"
                [icon]="BuildingIcon"
                [control]="$any(f['organizationName'])"
                errorKey="REGISTER.ERRORS"
            ></app-auth-input>

            <app-auth-input
                [label]="'REGISTER.TAX_ID_LABEL'"
                [placeholder]="'REGISTER.TAX_ID_PLACEHOLDER'"
                [icon]="HashIcon"
                [control]="$any(f['taxId'])"
                errorKey="REGISTER.ERRORS"
            ></app-auth-input>
          </div>
      </div>

      <input type="hidden" formControlName="fiscalRegionId">

      <app-auth-button
        type="submit"
        [loading]="isLoading()"
        [disabled]="registerForm.invalid"
      >
        {{ 'REGISTER.SUBMIT_BUTTON' | translate }}
      </app-auth-button>

    </form>

    <app-social-login (socialLogin)="onSocialLogin($event)"></app-social-login>

    <div class="login-link-container">
      <p>
        {{ 'REGISTER.ALREADY_HAVE_ACCOUNT' | translate }}
        <a routerLink="../login">
          {{ 'REGISTER.LOGIN_LINK' | translate }}
        </a>
      </p>
    </div>
  </div>
</app-auth-layout>
