
<app-auth-layout>
  <div class="animate-fadeIn w-full">

    <div class="text-center mb-6">
      <h2 class="text-3xl font-bold text-gray-900 tracking-tight mb-2">{{ 'REGISTER.TITLE' | translate }}</h2>
      <p class="text-gray-500">{{ 'REGISTER.SUBTITLE' | translate }}</p>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage()" class="mb-4 p-3 rounded-lg bg-red-50 border border-red-100 flex items-center justify-center animate-shake">
      <span class="text-sm text-red-600 font-medium">{{ errorMessage() | translate }}</span>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">

      <!-- Personal Info Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-auth-input
          [label]="'REGISTER.FIRST_NAME_LABEL'"
          [placeholder]="'REGISTER.FIRST_NAME_PLACEHOLDER'"
          [icon]="UserIcon"
          [control]="$any(f['firstName'])"
          errorKey="REGISTER.ERRORS"
        ></app-auth-input>

        <app-auth-input
          [label]="'REGISTER.LAST_NAME_LABEL'"
          [placeholder]="'REGISTER.LAST_NAME_PLACEHOLDER'"
          [icon]="UserIcon"
          [control]="$any(f['lastName'])"
          errorKey="REGISTER.ERRORS"
        ></app-auth-input>
      </div>

      <app-auth-input
        [label]="'REGISTER.EMAIL_LABEL'"
        [placeholder]="'REGISTER.EMAIL_PLACEHOLDER'"
        type="email"
        [icon]="MailIcon"
        [control]="$any(f['email'])"
        errorKey="REGISTER.ERRORS"
      ></app-auth-input>

      <app-auth-input
        [label]="'REGISTER.PASSWORD_LABEL'"
        [placeholder]="'REGISTER.PASSWORD_PLACEHOLDER'"
        type="password"
        [icon]="LockIcon"
        [control]="$any(f['password'])"
        errorKey="REGISTER.ERRORS"
      ></app-auth-input>

      <div class="border-t border-gray-100 my-4 pt-4">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">{{ 'REGISTER.COMPANY_INFO' | translate }}</p>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <app-auth-input
                [label]="'REGISTER.ORG_NAME_LABEL'"
                [placeholder]="'REGISTER.ORG_NAME_PLACEHOLDER'"
                [icon]="BuildingIcon"
                [control]="$any(f['organizationName'])"
                errorKey="REGISTER.ERRORS"
            ></app-auth-input>

            <app-auth-input
                [label]="'REGISTER.TAX_ID_LABEL'"
                [placeholder]="'REGISTER.TAX_ID_PLACEHOLDER'"
                [icon]="HashIcon"
                [control]="$any(f['taxId'])"
                errorKey="REGISTER.ERRORS"
            ></app-auth-input>
          </div>
      </div>

      <!-- Hidden Fiscal Region for now, assuming auto-detected or default -->
      <input type="hidden" formControlName="fiscalRegionId">

      <app-auth-button
        type="submit"
        [loading]="isLoading()"
        [disabled]="registerForm.invalid"
      >
        {{ 'REGISTER.SUBMIT_BUTTON' | translate }}
      </app-auth-button>

    </form>

    <div class="mt-6 text-center">
      <p class="text-sm text-gray-500">
        {{ 'REGISTER.ALREADY_HAVE_ACCOUNT' | translate }}
        <a routerLink="../login" class="font-semibold text-primary hover:text-primary-dark transition-colors ml-1">
          {{ 'REGISTER.LOGIN_LINK' | translate }}
        </a>
      </p>
    </div>
  </div>
</app-auth-layout>
