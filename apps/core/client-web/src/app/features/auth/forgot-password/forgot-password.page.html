
<app-auth-layout>
  <div class="auth-view fade-in">
    <div class="header">
      <h2>{{ 'AUTH.FORGOT_PASSWORD.TITLE' | translate }}</h2>
      <p>{{ 'AUTH.FORGOT_PASSWORD.SUBTITLE' | translate }}</p>
    </div>

    <div *ngIf="successMessage()" class="alert-success">
      <lucide-icon [img]="CheckCircleIcon"></lucide-icon>
      <p>{{ successMessage() | translate }}</p>
    </div>

    <div *ngIf="errorMessage()" class="alert-error">
      <lucide-icon [img]="AlertCircleIcon"></lucide-icon>
      <p>{{ errorMessage() | translate }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form" *ngIf="!successMessage()">
      <app-auth-input
        [label]="'AUTH.EMAIL_LABEL'"
        [placeholder]="'AUTH.EMAIL_PLACEHOLDER'"
        type="email"
        [icon]="MailIcon"
        [control]="$any(emailControl)"
        errorKey="AUTH.ERRORS"
      ></app-auth-input>

      <app-auth-button
        type="submit"
        [loading]="isLoading()"
        [disabled]="form.invalid"
      >
        {{ 'AUTH.FORGOT_PASSWORD.SUBMIT_BUTTON' | translate }}
      </app-auth-button>
    </form>

    <div class="back-link-container">
      <a routerLink="../login">
        <lucide-icon [img]="ArrowLeftIcon"></lucide-icon>
        {{ 'AUTH.BACK_TO_LOGIN' | translate }}
      </a>
    </div>
  </div>
</app-auth-layout>
