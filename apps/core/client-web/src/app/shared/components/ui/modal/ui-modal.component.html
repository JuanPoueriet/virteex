@if (isOpen()) {
  <div class="modal-container" [@modalContainer]>
    <!-- Backdrop -->
    <div class="modal-backdrop" [@modalBackdrop] (click)="onBackdropClick()"></div>

    <!-- Modal Panel -->
    <div class="modal-panel-wrapper">
      <div
        class="modal-panel"
        [class]="'size-' + size()"
        [@modalPanel]
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="title()">

        <!-- Header -->
        @if (title() || !hideCloseButton()) {
          <div class="modal-header">
            @if (title()) {
              <h2 class="modal-title">{{ title() }}</h2>
            }
            <div class="modal-actions">
              @if (!hideCloseButton()) {
                <button
                  class="close-button"
                  (click)="closeModal()"
                  type="button"
                  aria-label="Close">
                  <lucide-icon [img]="XIcon" class="icon"></lucide-icon>
                </button>
              }
            </div>
          </div>
        }

        <!-- Content -->
        <div class="modal-content">
          <ng-content></ng-content>
        </div>

        <!-- Footer (Optional) -->
        <!-- We use the hidden div trick to detect content, but strictly controlling visibility via class or structure -->
        <div class="modal-footer" [style.display]="hasFooter() ? 'block' : 'none'">
           <ng-content select="[footer]"></ng-content>
        </div>

        <!-- Hidden ref to check if footer exists.
             Note: content detection with ng-content is tricky in Angular.
             Ideally we would use contentChild if the user passed a directive.
             For raw HTML projection, checking the DOM is the fallback.
        -->
        <div #footerContent style="display: none"><ng-content select="[footer]"></ng-content></div>
      </div>
    </div>
  </div>
}
