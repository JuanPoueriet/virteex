@if (isOpen()) {
  <div class="modal-container" [@modalContainer]>
    <!-- Backdrop -->
    <div class="modal-backdrop" [@modalBackdrop] (click)="onBackdropClick()"></div>

    <!-- Modal Panel -->
    <div class="modal-panel-wrapper">
      <div
        class="modal-panel"
        [class]="'size-' + size()"
        [@modalPanel]
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="title()">

        <!-- Header -->
        @if (title() || !hideCloseButton()) {
          <div class="modal-header">
            @if (title()) {
              <h2 class="modal-title">{{ title() }}</h2>
            }
            <div class="modal-actions">
              @if (!hideCloseButton()) {
                <button
                  class="close-button"
                  (click)="closeModal()"
                  type="button"
                  aria-label="Close">
                  <lucide-icon [img]="XIcon" class="icon"></lucide-icon>
                </button>
              }
            </div>
          </div>
        }

        <!-- Content -->
        <div class="modal-content">
          <ng-content></ng-content>
        </div>

        <!-- Footer (Optional) -->
        <!-- We avoid checking childNodes on a viewChild signal in the template because it can be unstable during change detection.
             Instead we just use CSS to hide it if empty, or we assume it's always there if projected.
             The :empty pseudo-class works if there's no whitespace.
             But ng-content doesn't render a wrapper.
             The wrapper div we put around it will not be empty if ng-content projects something? No, ng-content is replaced.
             So we need to wrap ng-content in a wrapper that we control.
        -->
        <div class="modal-footer" #footerWrapper>
           <ng-content select="[footer]"></ng-content>
        </div>
      </div>
    </div>
  </div>
}
